name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_DIR: /srv/apps/sarko-api
  HEALTH_URL: https://sarko-api.pasteprosmana.my.id/v1/health

jobs:
  deploy:
    name: Deploy ke VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Cek secrets wajib
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          missing=""
          for v in TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET VPS_HOST VPS_USER VPS_SSH_KEY; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Secret belum diisi:$missing"
            echo "Lihat .github/DEPLOY-SETUP.md"
            exit 1
          fi
          echo "Semua secret tersedia."

      - name: Join tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.VPS_HOST }}

      - name: Siapkan SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH key siap."

      - name: Sinkronkan source ke VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='packages/contracts/node_modules/' \
            --exclude='packages/contracts/dist/' \
            --exclude='coverage/' \
            --exclude='*.tsbuildinfo' \
            --exclude='.env' \
            --exclude='.env.*' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./ "$VPS_USER@$VPS_HOST:$APP_DIR/"

      - name: Jalankan deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "bash $APP_DIR/scripts/deploy.sh"

      - name: Verifikasi health publik
        run: |
          for i in $(seq 1 15); do
            if curl -fsS -m 10 "$HEALTH_URL" | grep -q '"status":"ok"'; then
              echo "Health OK pada percobaan $i"
              curl -fsS -m 10 "$HEALTH_URL"
              exit 0
            fi
            echo "Percobaan $i gagal, tunggu 10 detik..."
            sleep 10
          done
          echo "::error::Health check publik gagal"
          exit 1
